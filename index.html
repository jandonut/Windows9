<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Windows 9©</title>
    <style>
        :root { --win-blue: #0078d7; }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; }
        
        #lockscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://i.postimg.cc/5tLGx11z/lockscreen.png') no-repeat center center/cover; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: transform 0.6s ease-in-out; }
        .login-box { text-align: center; background: rgba(0,0,0,0.4); padding: 30px; border-radius: 12px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.2); }
        .user-avatar { width: 100px; height: 100px; background: url('https://i.postimg.cc/xT84XLnr/lockscreen-flower.png') no-repeat center center/cover; border-radius: 8px; border: 2px solid white; margin-bottom: 15px; margin: 0 auto; }

        #desktop { height: 100vh; width: 100vw; background: url('https://i.postimg.cc/zfhpvJg7/Screenshot-2026-01-30-161252.png') no-repeat center center/cover; position: relative; }

        .window { position: absolute; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); border: 1px solid #999; border-radius: 6px 6px 0 0; display: flex; flex-direction: column; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow: hidden; min-width: 250px; min-height: 150px; resize: both; }
        .win-head { padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; cursor: move; background: linear-gradient(to bottom, #fff, #ccc); border-bottom: 1px solid #999; user-select: none; }
        .win-controls { display: flex; gap: 3px; }
        .win-controls button { width: 35px; height: 22px; border: none; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .win-close { background: #e81123; color: white; }
        .win-min, .win-max { background: #a9a9a9; color: #333; }
        .win-body { flex: 1; background: white; margin: 2px; overflow: auto; display: flex; flex-direction: column; position: relative; }

        .explorer-nav { padding: 5px; background: #f0f0f0; border-bottom: 1px solid #ccc; display: flex; gap: 5px; align-items: center; font-size: 12px; }
        .explorer-nav button { padding: 2px 8px; cursor: pointer; }

        #taskbar { position: absolute; bottom: 0; width: 100%; height: 40px; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); display: flex; align-items: center; padding: 0 10px; z-index: 10000; gap: 5px; }
        .start-orb { width: 36px; height: 36px; background: radial-gradient(circle, #6eb1ff, #1b4bb1); border-radius: 50%; cursor: pointer; border: 1px solid white; flex-shrink: 0; }
        #taskbar-apps { display: flex; gap: 4px; align-items: center; flex: 1; overflow: hidden; }
        .tb-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.25); padding: 3px 10px; cursor: pointer; border-radius: 3px; font-size: 12px; white-space: nowrap; height: 28px; }
        #clock { color: white; margin-left: auto; font-size: 11px; text-align: right; }

        #start-menu { position: absolute; bottom: 42px; left: 5px; width: 280px; background: white; border: 1px solid #666; display: none; z-index: 11000; padding: 10px; border-radius: 5px; box-shadow: 0 0 20px black; }
        .start-item { padding: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; border-radius: 3px; }
        .start-item:hover { background: var(--win-blue); color: white; }

        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, 90px); gap: 15px; padding: 20px; }
        .file-item { text-align: center; cursor: pointer; font-size: 11px; padding: 5px; user-select: none; border: 1px solid transparent; }
        .file-item:hover { background: rgba(0,120,215,0.1); border: 1px solid rgba(0,120,215,0.2); border-radius: 3px; }
        .file-item .icon { font-size: 32px; margin-bottom: 5px; pointer-events: none; }
        .file-item.drag-over { background: rgba(0,255,0,0.2); border: 1px dashed green; }

        iframe { border: none; width: 100%; height: 100%; flex: 1; }
        textarea { flex: 1; border: none; padding: 10px; font-family: monospace; outline: none; resize: none; }
    </style>
</head>
<body onclick="document.getElementById('start-menu').style.display='none'">

<div id="lockscreen">
    <div class="login-box">
        <div class="user-avatar"></div>
        <div style="font-size:22px; margin: 15px 0;">User</div>
        <input type="password" id="pass" placeholder="Kennwort" autocomplete="off" onkeydown="if(event.key==='Enter') login()" style="padding:8px; border:1px solid #999; width: 160px;">
        <button onclick="login()" style="padding:8px 12px; cursor:pointer;">➔</button>
        <p style="font-size:10px; color:#ccc; margin-top:15px;">Passwort: lockhtml</p>
    </div>
</div>

<div id="desktop">
    <div style="position:absolute; top:20px; left:20px; color:white; text-align:center; cursor:pointer;" ondblclick="openApp('Computer', '💻')">
        <div style="font-size:45px;">💻</div>Computer
    </div>

    <div id="taskbar">
        <div class="start-orb" onclick="event.stopPropagation(); toggleStart()"></div>
        <div id="taskbar-apps"></div>
        <div id="clock"></div>
    </div>

    <div id="start-menu" onclick="event.stopPropagation()">
        <div class="start-item" onclick="openApp('Computer', '💻')">💻 Computer</div>
        <div class="start-item" onclick="openApp('Radio', '📻')">📻 Radio Tuner</div>
        <div class="start-item" onclick="openApp('Internet Explorer', '🌐')">🌐 Google</div>
        <div class="start-item" onclick="openApp('Rechner', '🧮')">🧮 Rechner</div>
        <div class="start-item" onclick="openApp('Paint', '🎨')">🎨 Paint</div>
        <div class="start-item" onclick="openApp('Editor', '📝')">📝 Editor</div>
        <div class="start-item" onclick="openApp('Systemsteuerung', '⚙️')">⚙️ Systemsteuerung</div>
        <hr>
        <div class="start-item" onclick="location.reload()">🔒 Abmelden</div>
    </div>
</div>

<audio id="radio-noise" loop src="https://www.soundjay.com/tv-and-radio/static-radio-01.mp3"></audio>
<audio id="radio-stream"></audio>

<script>
    let zIdx = 1000;
    let currentPass = "lockhtml";
    let maximizedState = {};

    let fs = [
        { id: 1, name: 'LibreOffice.txt', type: 'file', content: 'https://limewire.com/d/7DCRk#x8YcWtyHSs', parent: 0 },
        { id: 2, name: 'Games.txt', type: 'file', content: 'hier kommen bald games', parent: 0 },
        { id: 3, name: 'Dokumente', type: 'folder', parent: 0 },
        { id: 4, name: 'Apps', type: 'folder', parent: 0 },
        { id: 101, name: 'Radio Tuner', type: 'app-link', icon: '📻', app: 'Radio', parent: 4 },
        { id: 102, name: 'Google', type: 'app-link', icon: '🌐', app: 'Internet Explorer', parent: 4 },
        { id: 103, name: 'Rechner', type: 'app-link', icon: '🧮', app: 'Rechner', parent: 4 },
        { id: 104, name: 'Paint', type: 'app-link', icon: '🎨', app: 'Paint', parent: 4 },
        { id: 105, name: 'Editor', type: 'app-link', icon: '📝', app: 'Editor', parent: 4 },
        { id: 106, name: 'Systemsteuerung', type: 'app-link', icon: '⚙️', app: 'Systemsteuerung', parent: 4 }
    ];

    function login() {
        if(document.getElementById('pass').value === currentPass) {
            document.getElementById('lockscreen').style.transform = 'translateY(-100%)';
            setTimeout(() => document.getElementById('lockscreen').style.display = 'none', 600);
        } else { alert("Falsches Passwort!"); }
    }

    function toggleStart() {
        const m = document.getElementById('start-menu');
        m.style.display = m.style.display === 'block' ? 'none' : 'block';
    }

    function openApp(t, icon, fileData = null, folderId = 0) {
        const id = 'win-' + Date.now();
        const win = document.createElement('div');
        win.className = 'window'; win.id = id; win.style.left = '120px'; win.style.top = '80px'; win.style.zIndex = ++zIdx;
        win.dataset.folder = folderId;

        win.style.width = (t === 'Internet Explorer' || t === 'Paint') ? "750px" : "480px";
        win.style.height = (t === 'Internet Explorer' || t === 'Paint') ? "550px" : "420px";

        let bodyHTML = '';
        if(t === 'Computer') {
            bodyHTML = `<div class="explorer-nav">
                <button onclick="goUp('${id}')">↑ Hoch</button>
                <button onclick="createNewFolder('${id}')">+ Ordner</button>
                <span id="path-${id}">C:\\</span>
            </div><div class="file-grid" id="grid-${id}"></div>`;
        } else if(t === 'Editor') {
            bodyHTML = `<div class="explorer-nav"><button onclick="saveFile('${id}')">Speichern</button> <span id="fn-${id}">${fileData ? fileData.name : 'Neu.txt'}</span></div>
                        <textarea id="tx-${id}">${fileData ? fileData.content : ''}</textarea>`;
        } else if(t === 'Rechner') {
            bodyHTML = `<div style="padding:15px; font-size:24px; text-align:right; background:#f4f4f4;" id="cd-${id}">0</div><div style="display:grid; grid-template-columns:repeat(4,1fr); gap:5px; padding:10px;">` + ['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(b => `<button style="padding:15px; cursor:pointer;" onclick="doCalc('${id}','${b}')">${b}</button>`).join('') + `</div>`;
        } else if(t === 'Paint') {
            bodyHTML = `<canvas id="cv-${id}" width="750" height="500" style="background:white; cursor:crosshair;"></canvas>`;
        } else if(t === 'Internet Explorer') {
            bodyHTML = `<iframe src="https://www.bing.com/search?q=windows+9" width="100%" height="100%"></iframe>`;
        } else if(t === 'Systemsteuerung') {
            bodyHTML = `<div style="padding:20px;"><h3>System</h3><p>Hintergrund ändern:</p><input type="text" id="wp-${id}" placeholder="URL..."><button onclick="updateWallpaper(document.getElementById('wp-${id}').value)">OK</button></div>`;
        } else if(t === 'Radio') {
            bodyHTML = `<div style="background:#222; color:#0f0; padding:20px; text-align:center; height:100%;">
                <div id="f-${id}" style="font-size:30px">87.5 MHz</div>
                <input type="range" min="87.5" max="108.0" step="0.1" style="width:100%" oninput="tune('${id}', this.value)">
                <button onclick="document.getElementById('radio-noise').play()">Power ON</button>
                <div style="margin-top:20px; font-size:12px; color:#888;">Stationen: 97.80, 102.40, 101.10</div>
            </div>`;
        }

        win.innerHTML = `<div class="win-head" onmousedown="focusWin('${id}'); drag(this.parentElement, event)">
            <span>${icon} ${fileData ? fileData.name : t}</span>
            <div class="win-controls">
                <button class="win-min" onclick="minimizeWin('${id}')">_</button>
                <button class="win-max" onclick="maximizeWin('${id}')">□</button>
                <button class="win-close" onclick="closeWin('${id}', '${t}')">×</button>
            </div>
        </div><div class="win-body">${bodyHTML}</div>`;
        
        document.getElementById('desktop').appendChild(win);
        if(t === 'Computer') refreshExplorer(id, folderId);
        if(t === 'Paint') initPaint(id);

        const btn = document.createElement('button');
        btn.className = 'tb-btn'; btn.id = 'tb-' + id; btn.innerText = icon + ' ' + (fileData ? fileData.name : t);
        btn.onclick = () => { if(win.style.display==='none'){win.style.display='flex'; focusWin(id);} else {minimizeWin(id);} };
        document.getElementById('taskbar-apps').appendChild(btn);
    }

    function refreshExplorer(winId, folderId) {
        const grid = document.getElementById('grid-' + winId);
        if(!grid) return;
        grid.innerHTML = '';
        const folder = fs.find(f => f.id == folderId);
        document.getElementById('path-' + winId).innerText = "C:\\" + (folder ? folder.name : "");

        fs.filter(f => f.parent == folderId).forEach(item => {
            const el = document.createElement('div');
            el.className = 'file-item';
            el.draggable = true;
            let icon = item.type === 'folder' ? '📁' : (item.type === 'app-link' ? item.icon : '📄');
            el.innerHTML = `<div class="icon">${icon}</div><div>${item.name}</div>`;
            
            el.ondragstart = (e) => e.dataTransfer.setData("text", item.id);
            if(item.type === 'folder') {
                el.ondragover = (e) => { e.preventDefault(); el.classList.add('drag-over'); };
                el.ondragleave = () => el.classList.remove('drag-over');
                el.ondrop = (e) => {
                    e.preventDefault();
                    el.classList.remove('drag-over');
                    const draggedId = e.dataTransfer.getData("text");
                    const targetId = item.id;
                    if(draggedId != targetId) {
                        const target = fs.find(f => f.id == draggedId);
                        if(target) { target.parent = targetId; refreshExplorer(winId, folderId); }
                    }
                };
            }

            el.ondblclick = () => {
                if(item.type === 'folder') { document.getElementById(winId).dataset.folder = item.id; refreshExplorer(winId, item.id); }
                else if(item.type === 'app-link') openApp(item.app, item.icon);
                else openApp('Editor', '📝', item);
            };
            grid.appendChild(el);
        });
    }

    function createNewFolder(winId) {
        const name = prompt("Ordnername:", "Neuer Ordner");
        if(name) {
            const parent = document.getElementById(winId).dataset.folder;
            fs.push({ id: Date.now(), name, type: 'folder', parent: parseInt(parent) });
            refreshExplorer(winId, parent);
        }
    }

    function goUp(winId) {
        const folderId = document.getElementById(winId).dataset.folder;
        const folder = fs.find(f => f.id == folderId);
        if(folder) {
            document.getElementById(winId).dataset.folder = folder.parent;
            refreshExplorer(winId, folder.parent);
        }
    }

    function minimizeWin(id) { document.getElementById(id).style.display = 'none'; }
    function maximizeWin(id) {
        const win = document.getElementById(id);
        if(maximizedState[id]) {
            const s = maximizedState[id];
            win.style.left = s.l; win.style.top = s.t; win.style.width = s.w; win.style.height = s.h;
            delete maximizedState[id];
        } else {
            maximizedState[id] = { l: win.style.left, t: win.style.top, w: win.style.width, h: win.style.height };
            win.style.left = '0'; win.style.top = '0'; win.style.width = '100vw'; win.style.height = 'calc(100vh - 40px)';
        }
    }

    function closeWin(id, type) {
        if(type === 'Radio') { document.getElementById('radio-noise').pause(); document.getElementById('radio-stream').pause(); }
        document.getElementById(id).remove();
        if(document.getElementById('tb-' + id)) document.getElementById('tb-' + id).remove();
    }

    function drag(el, e) {
        let p3=e.clientX, p4=e.clientY;
        document.onmousemove = (e) => { el.style.top = (el.offsetTop-(p4-e.clientY))+"px"; el.style.left = (el.offsetLeft-(p3-e.clientX))+"px"; p3=e.clientX; p4=e.clientY; };
        document.onmouseup = () => document.onmousemove = null;
    }

    function focusWin(id) { document.getElementById(id).style.zIndex = ++zIdx; }

    function tune(id, v) {
        const f = parseFloat(v).toFixed(2); document.getElementById('f-'+id).innerText = f + " MHz";
        const n = document.getElementById('radio-noise'); const s = document.getElementById('radio-stream');
        const urls = {"97.80": "https://rbrs-live.cast.addradio.de/rbrs/live/mp3/high", "102.40": "https://wdr-1live-live.icecastssl.wdr.de/wdr/1live/live/mp3/128/stream.mp3", "101.10": "https://swr-swr3-live.cast.addradio.de/swr/swr3/live/mp3/128/stream.mp3"};
        if(urls[f]) { s.src = urls[f]; s.play(); n.volume = 0; } else { s.pause(); n.volume = 0.2; }
    }

    function doCalc(id, b) {
        const d = document.getElementById('cd-'+id);
        if(b==='C') d.innerText='0'; 
        else if(b==='=') { try { d.innerText = eval(d.innerText); } catch { d.innerText = "Error"; } } 
        else d.innerText=(d.innerText==='0'?b:d.innerText+b);
    }

    function initPaint(id) {
        const c = document.getElementById('cv-'+id); const ctx = c.getContext('2d');
        let d = false; c.onmousedown = () => d = true; c.onmouseup = () => { d = false; ctx.beginPath(); };
        c.onmousemove = (e) => { if(!d) return; ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
    }

    function updateWallpaper(url) { if(url) document.getElementById('desktop').style.backgroundImage = `url('${url}')`; }

    setInterval(() => { 
        const d = new Date(); 
        document.getElementById('clock').innerHTML = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + "<br>" + d.toLocaleDateString(); 
    }, 1000);
</script>
</body>
</html>
